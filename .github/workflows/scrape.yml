name: Daily PS Store Deals Scraper

    on:
      schedule:
        # Jalan tiap hari jam 01:00 UTC (08:00 WIB)
        - cron: '0 1 * * *'
      workflow_dispatch:

    permissions:
      contents: write

    jobs:
      scrape:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'

          - name: Install dependencies
            run: pip install -r requirements.txt

          - name: Run PS Store scraper
            run: python scripts/scrape_ps.py

          - name: Commit and push updated deals
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add data/history.json docs/deals.json
              git diff --staged --quiet || git commit -m "chore: update PS Store deals $(date -u +'%Y-%m-%d')"
              git push
